name: OVYX Mobile Build

on:
  workflow_dispatch:
    inputs:
      job_id:
        type: string
        required: true
      display_name:
        type: string
        required: true
      platforms:
        type: string
        required: true
      payload_expires:
        type: string
        required: true
      payload_signature:
        type: string
        required: true
      project_slug:
        type: string
        required: true

jobs:
  build_android:
    if: ${{ contains(inputs.platforms, 'android') }}
    name: Build Android APK
    type: build
    environment: preview
    params:
      platform: android
      profile: preview
      message: OVYX_BUILD_JOB:${{ inputs.job_id }}
    hooks:
      before_install_node_modules:
        - name: Prepare OVYX web payload
          run: |
            export OVYX_MOBILE_JOB_ID='${{ inputs.job_id }}'
            export OVYX_MOBILE_PAYLOAD_EXPIRES='${{ inputs.payload_expires }}'
            export OVYX_MOBILE_BUILD_PAYLOAD_SECRET="$OVYX_MOBILE_BUILD_PAYLOAD_SECRET"
            export OVYX_APP_DISPLAY_NAME='${{ inputs.display_name }}'
            export OVYX_APP_SLUG='${{ inputs.project_slug }}'
            node scripts/prepare-ovyx-build.mjs

  build_ios:
    if: ${{ contains(inputs.platforms, 'ios') }}
    name: Build Apple iOS IPA
    type: build
    environment: preview
    params:
      platform: ios
      profile: preview
      message: OVYX_BUILD_JOB:${{ inputs.job_id }}
    hooks:
      before_install_node_modules:
        - name: Prepare OVYX web payload
          run: |
            export OVYX_MOBILE_JOB_ID='${{ inputs.job_id }}'
            export OVYX_MOBILE_PAYLOAD_EXPIRES='${{ inputs.payload_expires }}'
            export OVYX_MOBILE_BUILD_PAYLOAD_SECRET="$OVYX_MOBILE_BUILD_PAYLOAD_SECRET"
            export OVYX_APP_DISPLAY_NAME='${{ inputs.display_name }}'
            export OVYX_APP_SLUG='${{ inputs.project_slug }}'
            node scripts/prepare-ovyx-build.mjs
