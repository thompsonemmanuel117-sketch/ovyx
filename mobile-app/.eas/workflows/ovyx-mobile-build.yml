name: OVYX Mobile Build

on:
  workflow_dispatch:
    inputs:
      job_id:
        type: string
        required: true
      display_name:
        type: string
        required: true
      platforms:
        type: string
        required: true
      payload_expires:
        type: string
        required: true
      payload_signature:
        type: string
        required: true
      project_slug:
        type: string
        required: true

jobs:
  build_android:
    if: ${{ contains(inputs.platforms, 'android') }}
    name: Build Android APK
    type: build
    environment: preview
    env:
      OVYX_MOBILE_JOB_ID: ${{ inputs.job_id }}
      OVYX_MOBILE_PAYLOAD_EXPIRES: ${{ inputs.payload_expires }}
      OVYX_APP_DISPLAY_NAME: ${{ inputs.display_name }}
      OVYX_APP_SLUG: ${{ inputs.project_slug }}
    params:
      platform: android
      profile: preview
      message: OVYX_BUILD_JOB:${{ inputs.job_id }}

  build_ios:
    if: ${{ contains(inputs.platforms, 'ios') }}
    name: Build Apple iOS IPA
    type: build
    environment: preview
    env:
      OVYX_MOBILE_JOB_ID: ${{ inputs.job_id }}
      OVYX_MOBILE_PAYLOAD_EXPIRES: ${{ inputs.payload_expires }}
      OVYX_APP_DISPLAY_NAME: ${{ inputs.display_name }}
      OVYX_APP_SLUG: ${{ inputs.project_slug }}
    params:
      platform: ios
      profile: preview
      message: OVYX_BUILD_JOB:${{ inputs.job_id }}
