# OVYX Cloudflare Pages configuration
# Secrets are never committed here. Configure them in Cloudflare Pages/Workers.
name = "ovyx"
pages_build_output_dir = "."
compatibility_date = "2026-09-27"
compatibility_flags = ["nodejs_compat"]
send_metrics = true

[ai]
binding = "AI"

[vars]
OVYX_RUNTIME = "cloudflare-pages"
OVYX_APP_NAME = "OVYX"
OVYX_AI_PROVIDER_ORDER = "gemini,deepseek,cloudflare-workers-ai,groq"

# Required production secrets:
# FIREBASE_SERVICE_ACCOUNT_JSON
# FIREBASE_PROJECT_ID
# FIREBASE_WEB_API_KEY
# GITHUB_APP_ID
# GITHUB_APP_INSTALLATION_ID
# GITHUB_APP_PRIVATE_KEY
# GITHUB_TOKEN_ENCRYPTION_KEY
# GITHUB_ALLOWED_REPOS
# GITHUB_CLIENT_ID
# GITHUB_CLIENT_SECRET
# GITHUB_REDIRECT_URI
# PAYSTACK_SECRET_KEY
# OPAY_MERCHANT_ID
# OPAY_CASHIER_PUBLIC_KEY
# OPAY_CASHIER_SECRET_KEY
# GEMINI_API_KEY
# ANTHROPIC_API_KEY
# DEEPSEEK_API_KEY
# OPENAI_API_KEY
# GROQ_API_KEY
# GROQ_MODEL
# CLOUDFLARE_AI_MODEL
# OVYX_CONNECTION_ENCRYPTION_KEY

# Optional callback/agent secrets:
# OVYX_AGENT_CALLBACK_SECRET
# OVYX_AGENT_CALLBACK_URL
