name: OVYX Assistant Runtime and Deep Search Contracts

on:
  push:
    branches:
      - main
    paths:
      - 'assets/ovyx-assistant-workspace.js'
      - 'functions/api/ai/workspace-tools.js'
      - 'functions/_lib/ovyx-native-ai.js'
      - 'scripts/ovyx-assistant-runtime.test.mjs'
      - 'scripts/ovyx-workspace-tools.test.mjs'
      - '.github/workflows/ovyx-assistant-deep-search-browser.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'assets/ovyx-assistant-workspace.js'
      - 'functions/api/ai/workspace-tools.js'
      - 'functions/_lib/ovyx-native-ai.js'
      - 'scripts/ovyx-assistant-runtime.test.mjs'
      - 'scripts/ovyx-workspace-tools.test.mjs'
      - '.github/workflows/ovyx-assistant-deep-search-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify native assistant runtime and deep-search contracts
        run: |
          node scripts/ovyx-assistant-runtime.test.mjs
          node scripts/ovyx-workspace-tools.test.mjs
