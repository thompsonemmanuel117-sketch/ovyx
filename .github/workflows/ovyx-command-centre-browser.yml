name: OVYX Dashboard De-duplication Browser Tests

on:
  push:
    branches: [main]
    paths:
      - 'assets/ovyx-account-notifications.js'
      - 'docs/OVYX-STAGE-5-COMMAND-CENTRE.md'
      - 'assets/ovyx-command-centre.js'
      - 'assets/ovyx-home-dashboard-behavior.js'
      - 'assets/css/ovyx-command-centre.css'
      - 'assets/ovyx-admin-controls.js'
      - 'functions/_middleware.js'
      - '_headers'
      - 'package.json'
      - 'scripts/ovyx-command-centre.test.mjs'
      - 'scripts/ovyx-command-centre.browser.test.mjs'
      - 'scripts/ovyx-home-dashboard-behavior.test.mjs'
      - 'scripts/ovyx-owner-browser-api-fixtures.mjs'
      - '.github/workflows/ovyx-command-centre-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/ovyx-command-centre.js'
      - 'assets/css/ovyx-command-centre.css'
      - 'assets/ovyx-admin-controls.js'
      - 'functions/_middleware.js'
      - '_headers'
      - 'package.json'
      - 'scripts/ovyx-command-centre.test.mjs'
      - 'scripts/ovyx-command-centre.browser.test.mjs'
      - 'scripts/ovyx-owner-browser-api-fixtures.mjs'
      - '.github/workflows/ovyx-command-centre-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Verify the duplicate Home dashboard section stays removed while the owner overview remains protected.
  command-centre-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts --no-save playwright@^1.55.0
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run dashboard de-duplication contract and static validation
        run: |
          node scripts/ovyx-command-centre.test.mjs
          node scripts/ovyx-home-dashboard-behavior.test.mjs
          npm run validate
      - name: Start local Cloudflare Pages app shell
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8795 > /tmp/ovyx-command-centre-pages.log 2>&1 &
          echo $! > /tmp/ovyx-command-centre-pages.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8795/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ovyx-command-centre-pages.log
          exit 1
      - name: Test desktop and mobile Home dashboard de-duplication in Chromium
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8795
        run: node scripts/ovyx-command-centre.browser.test.mjs
      - name: Print local Pages logs on failure
        if: failure()
        run: cat /tmp/ovyx-command-centre-pages.log || true
