name: OVYX Live Website Generation and Acceptance Evidence
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Run only a small provider readiness check or the full four-site acceptance
        required: true
        type: choice
        options:
          - preflight-only
          - full-acceptance
        default: preflight-only
      provider:
        description: AI provider to use for real website generation
        required: true
        type: choice
        options:
          - cloudflare-workers-ai
          - automatic
          - gemini
          - claude
          - deepseek
          - openai
        default: cloudflare-workers-ai
  push:
    branches: [main]
    paths:
      # Any production AI provider or shared free-only budget guard, multi-page
      # builder, or website-quality prompt/context change must trigger trusted
      # live acceptance on main.
      - 'functions/_lib/providers.js'
      - 'functions/_lib/cloudflare-free-ai.js'
      - 'functions/_lib/firebase-admin.js'
      - 'functions/_lib/studio-multipage.js'
      - 'functions/_lib/prompts.js'
      - 'functions/_lib/experience.js'
      - 'functions/_lib/market-context.js'
      - 'functions/_lib/visual-asset-plan.js'
      - 'functions/api/internal/live-generation-eval.js'
      - 'scripts/ovyx-cloudflare-live-generation-client.mjs'
      - 'scripts/ovyx-cloudflare-preflight-only.test.mjs'
      - 'scripts/ovyx-cloudflare-live-generation-oidc.test.mjs'
      - 'scripts/ovyx-cloudflare-runtime-config-inventory.mjs'
      - 'scripts/ovyx-cloudflare-runtime-config-inventory.test.mjs'
      - 'scripts/ovyx-webstudio-live-generation-eval.mjs'
      - 'scripts/ovyx-webstudio-acceptance-audit.mjs'
      - 'scripts/ovyx-webstudio-generated-site-browser-eval.mjs'
      - 'scripts/ovyx-live-service-integration-eval.mjs'
      - 'docs/OVYX-LIVE-ACCEPTANCE-SETUP.md'
      - '.github/workflows/ovyx-webstudio-live-generation.yml'
  pull_request:
    branches: [main]
    paths:
      - 'functions/_lib/providers.js'
      - 'functions/_lib/cloudflare-free-ai.js'
      - 'scripts/ovyx-cloudflare-budget-ledger-init.test.mjs'
      - 'functions/_lib/cloudflare-free-ai.js'
      - 'functions/_lib/firebase-admin.js'
      - 'functions/_lib/experience.js'
      - 'scripts/provider-routing.test.mjs'
      - 'scripts/ovyx-webstudio-generated-site-browser-eval.test.mjs'
      - 'functions/_lib/prompts.js'
      - 'functions/api/internal/live-generation-eval.js'
      - 'functions/_lib/studio-multipage.js'
      - 'functions/_lib/market-context.js'
      - 'functions/_lib/visual-asset-plan.js'
      - 'scripts/ovyx-webstudio-live-generation-eval.mjs'
      - 'scripts/ovyx-webstudio-acceptance-audit.mjs'
      - 'scripts/ovyx-webstudio-generated-site-browser-eval.mjs'
      - 'scripts/ovyx-live-service-integration-eval.mjs'
      - 'scripts/ovyx-live-service-integration-eval.test.mjs'
      - 'scripts/ovyx-webstudio-acceptance-audit.test.mjs'
      - 'scripts/ovyx-webstudio-live-generation-eval-contract.test.mjs'
      - 'scripts/ovyx-cloudflare-live-generation-client.mjs'
      - 'scripts/ovyx-cloudflare-preflight-only.test.mjs'
      - 'scripts/ovyx-cloudflare-live-generation-oidc.test.mjs'
      - 'scripts/ovyx-cloudflare-runtime-config-inventory.mjs'
      - 'scripts/ovyx-cloudflare-runtime-config-inventory.test.mjs'
      - 'docs/OVYX-LIVE-ACCEPTANCE-SETUP.md'
      - '.github/workflows/ovyx-webstudio-live-generation.yml'
permissions:
  contents: read
jobs:
  live-generation-evidence:
    name: Live AI generation and five-viewport QA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 90
    steps:
      - name: Checkout OVYX
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: npm install --ignore-scripts
      - name: Install Playwright and Chromium
        run: |
          npm install --ignore-scripts --no-save playwright@^1.55.0
          npx playwright install chromium
      - name: Run project regression tests
        run: npm test
      - name: Run browser evaluator and acceptance-audit tests
        run: |
          node scripts/ovyx-webstudio-generated-site-browser-eval.test.mjs
          node scripts/ovyx-webstudio-acceptance-audit.test.mjs
          node scripts/ovyx-webstudio-live-generation-eval-contract.test.mjs
          node scripts/ovyx-live-service-integration-eval.test.mjs
          node scripts/ovyx-cloudflare-live-generation-oidc.test.mjs
          node scripts/ovyx-cloudflare-preflight-only.test.mjs
      # Default main pushes run only the tiny provider check. After substantive
      # generation fixes, one trusted main commit titled with
      # [OVYX_FULL_ACCEPTANCE_ONCE] opts into a bounded full acceptance exactly
      # once; normal pushes remain preflight-only to control inference spend.
      - name: Generate four real AI websites using the existing Cloudflare runtime keys
        id: generate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          OVYX_EVAL_PROVIDER: ${{ github.event_name == 'workflow_dispatch' && inputs.provider || 'automatic' }}
          OVYX_EVAL_PREFLIGHT_ONLY: ${{ (github.event_name != 'workflow_dispatch' && !contains(github.event.head_commit.message, '[OVYX_FULL_ACCEPTANCE_ONCE]')) || (github.event_name == 'workflow_dispatch' && inputs.operation == 'preflight-only') }}
          OVYX_EVAL_MODEL: ${{ vars.OVYX_EVAL_MODEL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          OVYX_EVAL_LISTINGS_PUBLIC_BROWSER_URL: ${{ vars.OVYX_EVAL_LISTINGS_PUBLIC_BROWSER_URL }}
          OVYX_EVAL_LISTINGS_SOURCE_AUTHORITY: ${{ vars.OVYX_EVAL_LISTINGS_SOURCE_AUTHORITY }}
          OVYX_EVAL_PUBLIC_ENQUIRY_URL: ${{ vars.OVYX_EVAL_PUBLIC_ENQUIRY_URL }}
          OVYX_EVAL_ENABLE_EXTERNAL_ENQUIRY_PROBE: ${{ vars.OVYX_EVAL_ENABLE_EXTERNAL_ENQUIRY_PROBE }}
          OVYX_EVAL_ENQUIRY_TEST_RECIPIENT: ${{ secrets.OVYX_EVAL_ENQUIRY_TEST_RECIPIENT }}
        run: node scripts/ovyx-cloudflare-live-generation-client.mjs
      - name: Enforce provider-only preflight result
        if: github.ref == 'refs/heads/main' && ((github.event_name == 'push' && !contains(github.event.head_commit.message, '[OVYX_FULL_ACCEPTANCE_ONCE]')) || (github.event_name == 'workflow_dispatch' && inputs.operation == 'preflight-only'))
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          if [ "$GENERATION_OUTCOME" != "success" ]; then
            echo "Provider-only preflight failed. Full website generation and browser/integration probes were not run."
            exit 1
          fi
          echo "Provider-only preflight passed. No websites were generated."
      - name: State why PR runs do not use production credentials
        if: github.event_name == 'pull_request'
        run: echo "PR regression tests ran. Live generation and external enquiry probes run only on trusted main/workflow_dispatch events through the short-lived OIDC verifier; provider API keys stay in Cloudflare."
      - name: Inspect model-generated sites in Chromium at five widths
        if: always() && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.operation == 'full-acceptance') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[OVYX_FULL_ACCEPTANCE_ONCE]')))
        id: browser
        continue-on-error: true
        env:
          OVYX_EVAL_LISTINGS_PUBLIC_BROWSER_URL: ${{ steps.generate.outputs.listings_url }}
          OVYX_EVAL_PUBLIC_ENQUIRY_URL: ${{ steps.generate.outputs.enquiry_url }}
          OVYX_EVAL_ENABLE_EXTERNAL_ENQUIRY_PROBE: ${{ steps.generate.outputs.external_enquiry_authorized }}
          OVYX_EVAL_ENQUIRY_TEST_RECIPIENT: ${{ secrets.OVYX_EVAL_ENQUIRY_TEST_RECIPIENT }}
        run: node scripts/ovyx-webstudio-generated-site-browser-eval.mjs artifacts/webstudio-generated-sites artifacts/webstudio-evaluation-report/browser
      - name: Evaluate configured real listing and enquiry services
        if: always() && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.operation == 'full-acceptance') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[OVYX_FULL_ACCEPTANCE_ONCE]')))
        id: integration
        continue-on-error: true
        env:
          OVYX_EVAL_LISTINGS_API_URL: ${{ steps.generate.outputs.listings_url }}
          OVYX_EVAL_LISTINGS_PUBLIC_BROWSER_URL: ${{ steps.generate.outputs.listings_url }}
          OVYX_EVAL_LISTINGS_SOURCE_AUTHORITY: ${{ steps.generate.outputs.listings_source_authority }}
          OVYX_EVAL_LISTINGS_JSON_PATH: ${{ steps.generate.outputs.listings_json_path }}
          OVYX_EVAL_LISTING_ID_FIELD: ${{ steps.generate.outputs.listing_id_field }}
          OVYX_EVAL_LISTING_TITLE_FIELD: ${{ steps.generate.outputs.listing_title_field }}
          OVYX_EVAL_LISTING_LOCATION_FIELD: ${{ steps.generate.outputs.listing_location_field }}
          OVYX_EVAL_LISTING_STATUS_FIELD: ${{ steps.generate.outputs.listing_status_field }}
          OVYX_EVAL_REAL_ENQUIRY_URL: ${{ steps.generate.outputs.enquiry_url }}
          OVYX_EVAL_ENABLE_EXTERNAL_ENQUIRY_PROBE: ${{ steps.generate.outputs.external_enquiry_authorized }}
          OVYX_EVAL_ENQUIRY_TEST_RECIPIENT: ${{ secrets.OVYX_EVAL_ENQUIRY_TEST_RECIPIENT }}
          OVYX_INTEGRATION_REPORT_OUT: artifacts/webstudio-evaluation-report/integration-report.json
        run: node scripts/ovyx-live-service-integration-eval.mjs
      - name: Audit copy, routes, visuals and integration claims
        if: always() && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.operation == 'full-acceptance') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[OVYX_FULL_ACCEPTANCE_ONCE]')))
        id: audit
        continue-on-error: true
        run: node scripts/ovyx-webstudio-acceptance-audit.mjs artifacts/webstudio-generated-sites artifacts/webstudio-evaluation-report/browser/browser-report.json artifacts/webstudio-evaluation-report/acceptance-report.json artifacts/webstudio-evaluation-report/integration-report.json
      - name: Enforce honest quality gates and block incomplete live evidence
        if: always() && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.operation == 'full-acceptance') || (github.event_name == 'push' && contains(github.event.head_commit.message, '[OVYX_FULL_ACCEPTANCE_ONCE]')))
        env:
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          INTEGRATION_OUTCOME: ${{ steps.integration.outcome }}
          LISTINGS_SOURCE_URL: ${{ steps.generate.outputs.listings_url }}
          LISTINGS_PUBLIC_URL: ${{ steps.generate.outputs.listings_url }}
          ENQUIRY_TARGET_URL: ${{ steps.generate.outputs.enquiry_url }}
          PUBLIC_ENQUIRY_URL: ${{ steps.generate.outputs.enquiry_url }}
          ENQUIRY_PROBE_ENABLED: ${{ steps.generate.outputs.external_enquiry_authorized }}
          ENQUIRY_TEST_RECIPIENT: ${{ secrets.OVYX_EVAL_ENQUIRY_TEST_RECIPIENT }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const checks = [
            ['Cloudflare-backed generation step', process.env.GENERATION_OUTCOME],
            ['browser step', process.env.BROWSER_OUTCOME],
            ['acceptance audit step', process.env.AUDIT_OUTCOME],
          ];
          const failures = checks.filter(([, outcome]) => outcome !== 'success');
          if (process.env.INTEGRATION_OUTCOME !== 'success') failures.push(['listing/enquiry service evaluation', process.env.INTEGRATION_OUTCOME || 'not-run']);
          let browser = {};
          let audit = {};
          try { browser = JSON.parse(await fs.readFile('artifacts/webstudio-evaluation-report/browser/browser-report.json', 'utf8')); } catch {}
          try { audit = JSON.parse(await fs.readFile('artifacts/webstudio-evaluation-report/acceptance-report.json', 'utf8')); } catch {}
          let integration = {};
          try { integration = JSON.parse(await fs.readFile('artifacts/webstudio-evaluation-report/integration-report.json', 'utf8')); } catch {}
          if (browser.status !== 'browser-evaluated' || !browser.evaluatedSites) failures.push(['browser report', browser.status || 'missing']);
          if (!audit.sitesFound || audit.status === 'not-run-no-generated-sites' || audit.sites?.some(site => site.status === 'needs-attention')) failures.push(['acceptance report', audit.status || 'missing or has blockers']);
          if (!process.env.LISTINGS_SOURCE_URL) failures.push(['real property listings', 'blocked-no-authoritative-public-listing-feed-configured']);
          else if (!process.env.LISTINGS_PUBLIC_URL) failures.push(['public generated-site listing feed', 'blocked-no-public-browser-safe-listing-endpoint-configured']);
          else if (integration.listings?.realListingsConfirmed !== true) failures.push(['configured property feed', integration.listings?.status || 'no confirmed live listings rendered on the generated site']);
          if (!process.env.ENQUIRY_TARGET_URL) failures.push(['real enquiry integration', 'blocked-no-owner-approved-public-enquiry-endpoint-configured']);
          if (!process.env.PUBLIC_ENQUIRY_URL) failures.push(['generated-site enquiry form', 'blocked-no-public-client-safe-enquiry-endpoint-configured']);
          if (String(process.env.ENQUIRY_PROBE_ENABLED).toLowerCase() !== 'true') failures.push(['real enquiry integration', 'blocked-external-probe-not-explicitly-authorized']);
          if (!process.env.ENQUIRY_TEST_RECIPIENT) failures.push(['real enquiry integration', 'blocked-no-owner-controlled-test-recipient-configured']);
          if (integration.enquiry?.endpointAcceptedTestPayload !== true) failures.push(['server-side enquiry submission', integration.enquiry?.status || 'test payload not accepted']);
          if (integration.enquiry?.realEnquiryDeliveryConfirmed !== true) failures.push(['server-side enquiry delivery', 'endpoint accepted the test but did not report a confirmed delivery receipt']);
          if (!browser.results?.length || browser.results.some(site => site.publicEnquiryDeliveryConfirmed !== true)) failures.push(['generated-site public enquiry route', 'at least one generated site did not show an explicit delivery receipt for the safe test submission']);
          if (failures.length) {
            console.error(JSON.stringify({status:'needs-attention',failures,realListingsConfirmed:false,realEnquiryDeliveryConfirmed:false,humanVisualReviewCompleted:false,humanEditorialReviewCompleted:false},null,2));
            process.exitCode = 1;
          } else {
            console.log(JSON.stringify({
              status:'automated-checks-run-human-review-and-real-integration-verification-pending',
              browserSites:browser.evaluatedSites,
              reportSites:audit.sitesFound,
              realListingsConfirmed:integration.listings?.realListingsConfirmed===true,
              realEnquiryDeliveryConfirmed:integration.enquiry?.realEnquiryDeliveryConfirmed===true&&browser.results.length>0&&browser.results.every(site=>site.publicEnquiryDeliveryConfirmed===true),
              humanVisualReviewCompleted:false,
              humanEditorialReviewCompleted:false
            },null,2));
          }
          NODE
      - name: Preserve all screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovyx-live-generation-evidence
          path: |
            artifacts/webstudio-generated-sites/
            artifacts/webstudio-evaluation-report/
          if-no-files-found: warn
          retention-days: 30
