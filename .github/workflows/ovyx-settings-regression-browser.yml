name: OVYX Settings Regression Browser Tests

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/ovyx-settings-reliability.js'
      - 'assets/ovyx-settings-billing-live.js'
      - 'assets/ovyx-account-notifications.js'
      - 'assets/ovyx-personal-connections-center.js'
      - 'assets/ovyx-webstudio-cancel-safety.js'
      - 'assets/ovyx-scoped-rollback.js'
      - '_routes.json'
      - '_headers'
      - 'functions/_middleware.js'
      - 'functions/api/settings/**'
      - 'functions/api/payments/**'
      - 'functions/api/tokens/**'
      - 'functions/api/account/delete.js'
      - 'functions/api/api/auth/revoke-sessions.js'
      - 'scripts/cloudflare-application-shell.mjs'
      - 'scripts/ovyx-static-verify.mjs'
      - 'scripts/ovyx-cloudflare-diagnostics.test.mjs'
      - 'scripts/ovyx-settings-actions.test.mjs'
      - 'scripts/ovyx-settings.browser.test.mjs'
      - 'scripts/ovyx-settings-core.browser.test.mjs'
      - 'scripts/ovyx-settings-account.browser.test.mjs'
      - 'scripts/ovyx-settings-security.browser.test.mjs'
      - 'scripts/ovyx-settings-ai.browser.test.mjs'
      - 'scripts/ovyx-settings-workspace.browser.test.mjs'
      - 'scripts/ovyx-settings-shortcuts.browser.test.mjs'
      - 'scripts/ovyx-personal-connections.browser.test.mjs'
      - 'scripts/ovyx-cancel-safety.browser.test.mjs'
      - 'scripts/ovyx-mobile-back-navigation.browser.test.mjs'
      - 'scripts/ovyx-scoped-rollback-performance.browser.test.mjs'
      - 'scripts/ovyx-scoped-rollback-graph.browser.test.mjs'
      - '.github/workflows/ovyx-settings-regression-browser.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'assets/ovyx-settings-reliability.js'
      - 'assets/ovyx-settings-billing-live.js'
      - 'assets/ovyx-account-notifications.js'
      - 'assets/ovyx-personal-connections-center.js'
      - 'assets/ovyx-webstudio-cancel-safety.js'
      - 'assets/ovyx-scoped-rollback.js'
      - '_routes.json'
      - '_headers'
      - 'functions/_middleware.js'
      - 'functions/api/settings/**'
      - 'functions/api/payments/**'
      - 'functions/api/tokens/**'
      - 'functions/api/account/delete.js'
      - 'functions/api/api/auth/revoke-sessions.js'
      - 'scripts/cloudflare-application-shell.mjs'
      - 'scripts/ovyx-static-verify.mjs'
      - 'scripts/ovyx-cloudflare-diagnostics.test.mjs'
      - 'scripts/ovyx-settings-actions.test.mjs'
      - 'scripts/ovyx-settings.browser.test.mjs'
      - 'scripts/ovyx-settings-core.browser.test.mjs'
      - 'scripts/ovyx-settings-account.browser.test.mjs'
      - 'scripts/ovyx-settings-security.browser.test.mjs'
      - 'scripts/ovyx-settings-ai.browser.test.mjs'
      - 'scripts/ovyx-settings-workspace.browser.test.mjs'
      - 'scripts/ovyx-settings-shortcuts.browser.test.mjs'
      - 'scripts/ovyx-personal-connections.browser.test.mjs'
      - 'scripts/ovyx-cancel-safety.browser.test.mjs'
      - 'scripts/ovyx-mobile-back-navigation.browser.test.mjs'
      - 'scripts/ovyx-scoped-rollback-performance.browser.test.mjs'
      - 'scripts/ovyx-scoped-rollback-graph.browser.test.mjs'
      - '.github/workflows/ovyx-settings-regression-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  settings-regression-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts --no-save playwright@^1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Cloudflare Pages app shell
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8791 > /tmp/ovyx-settings-pages.log 2>&1 &
          echo $! > /tmp/ovyx-settings-pages.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8791/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ovyx-settings-pages.log
          exit 1

      - name: Verify Settings contracts and server-backed billing boundaries
        run: |
          npm run validate
          node scripts/ovyx-settings-actions.test.mjs
          node scripts/ovyx-cloudflare-diagnostics.test.mjs

      - name: Test every Settings category and its existing actions in desktop and mobile Chromium
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8791
        run: |
          set +e
          run_shard() {
            label="$1"
            shift
            for script in "$@"; do
              echo "[$label] Running $script"
              node "scripts/$script" || return $?
            done
          }

          run_shard "settings-core" \
            ovyx-settings.browser.test.mjs \
            ovyx-settings-core.browser.test.mjs \
            ovyx-settings-account.browser.test.mjs \
            ovyx-settings-security.browser.test.mjs \
            > /tmp/ovyx-settings-core.log 2>&1 &
          core_pid=$!

          run_shard "settings-workspace" \
            ovyx-settings-ai.browser.test.mjs \
            ovyx-settings-workspace.browser.test.mjs \
            ovyx-settings-shortcuts.browser.test.mjs \
            ovyx-personal-connections.browser.test.mjs \
            > /tmp/ovyx-settings-workspace.log 2>&1 &
          workspace_pid=$!

          run_shard "settings-safety" \
            ovyx-cancel-safety.browser.test.mjs \
            ovyx-scoped-rollback-performance.browser.test.mjs \
            ovyx-scoped-rollback-graph.browser.test.mjs \
            ovyx-mobile-back-navigation.browser.test.mjs \
            > /tmp/ovyx-settings-safety.log 2>&1 &
          safety_pid=$!

          wait "$core_pid"; core_status=$?
          wait "$workspace_pid"; workspace_status=$?
          wait "$safety_pid"; safety_status=$?

          cat /tmp/ovyx-settings-core.log
          cat /tmp/ovyx-settings-workspace.log
          cat /tmp/ovyx-settings-safety.log

          if [ "$core_status" -ne 0 ] || [ "$workspace_status" -ne 0 ] || [ "$safety_status" -ne 0 ]; then
            echo "One or more Settings browser-test shards failed."
            exit 1
          fi

      - name: Print local Pages logs on failure
        if: failure()
        run: cat /tmp/ovyx-settings-pages.log || true
