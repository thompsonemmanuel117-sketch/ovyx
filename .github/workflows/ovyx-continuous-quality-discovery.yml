name: OVYX Continuous Quality Discovery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-discovery:
    name: Ensure every test is executed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out OVYX
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit automated test execution wiring
        run: node scripts/ovyx-quality-test-discovery.test.mjs
