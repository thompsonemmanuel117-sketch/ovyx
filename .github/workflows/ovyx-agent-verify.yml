name: OVYX Agent Verify

on:
  push:
    branches:
      - main
      - 'ovyx/agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: OpenAI-compatible routing tests
        run: npm test

      - name: Static verification
        run: npm run validate

      - name: Production build preflight
        run: npm run build

      - name: Wrangler validation
        run: npx wrangler --version
