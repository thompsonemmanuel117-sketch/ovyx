name: OVYX Account Lifecycle Integration

on:
  pull_request:
    paths:
      - 'functions/_lib/auth.js'
      - 'functions/_lib/firebase-admin.js'
      - 'functions/_lib/subscription.js'
      - 'functions/_lib/token-quota.js'
      - 'functions/api/entitlements.js'
      - 'functions/api/payments/**'
      - 'functions/api/admin/users.js'
      - 'firebase-auth-blocking/**'
      - 'scripts/ovyx-account-lifecycle.integration.test.mjs'
      - '.github/workflows/ovyx-account-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'functions/_lib/auth.js'
      - 'functions/_lib/firebase-admin.js'
      - 'functions/_lib/subscription.js'
      - 'functions/_lib/token-quota.js'
      - 'functions/api/entitlements.js'
      - 'functions/api/payments/**'
      - 'functions/api/admin/users.js'
      - 'firebase-auth-blocking/**'
      - 'scripts/ovyx-account-lifecycle.integration.test.mjs'
      - '.github/workflows/ovyx-account-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-account-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out OVYX
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise isolated account lifecycle and production security contracts
        run: node scripts/ovyx-account-lifecycle.integration.test.mjs
      - name: Re-run payment webhook safety regressions
        run: node scripts/ovyx-payment-webhook-safety.test.mjs
      - name: Re-run account security regressions
        run: node scripts/ovyx-account-security.test.mjs
