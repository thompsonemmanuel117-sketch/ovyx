name: OVYX Disposable Backend Runtime Deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy isolated Pages/D1 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout OVYX
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-runtime/package.json
      - name: Validate deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OVYX_BACKEND_RUNTIME_SECRET: ${{ secrets.OVYX_BACKEND_RUNTIME_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Add CLOUDFLARE_API_TOKEN with Workers Scripts Edit, Workers Containers Edit and Durable Objects permissions."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Add CLOUDFLARE_ACCOUNT_ID."; exit 1; }
          test "${#OVYX_BACKEND_RUNTIME_SECRET}" -ge 32 || { echo "::error::Add a random OVYX_BACKEND_RUNTIME_SECRET of at least 32 characters."; exit 1; }
      - name: Install runtime Worker dependencies
        working-directory: backend-runtime
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy isolated backend runtime Worker and container
        working-directory: backend-runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Set runtime HMAC secret
        working-directory: backend-runtime
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OVYX_BACKEND_RUNTIME_SECRET: ${{ secrets.OVYX_BACKEND_RUNTIME_SECRET }}
        run: printf '%s' "$OVYX_BACKEND_RUNTIME_SECRET" | npx wrangler secret put OVYX_BACKEND_RUNTIME_SECRET --config wrangler.jsonc
