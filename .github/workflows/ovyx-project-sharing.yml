name: OVYX Project Sharing Security
on:
  pull_request:
    branches: [main]
    paths:
      - 'functions/api/project-sharing.js'
      - 'functions/api/projects.js'
      - 'functions/api/_lib/firebase-admin.js'
      - 'assets/ovyx-project-sharing.js'
      - 'assets/css/ovyx-project-sharing.css'
      - 'index.html'
      - 'functions/_middleware.js'
      - 'scripts/ovyx-project-sharing.test.mjs'
      - 'package.json'
      - '.github/workflows/ovyx-project-sharing.yml'
  push:
    branches: [main]
    paths:
      - 'functions/api/project-sharing.js'
      - 'functions/api/projects.js'
      - 'functions/api/_lib/firebase-admin.js'
      - 'assets/ovyx-project-sharing.js'
      - 'assets/css/ovyx-project-sharing.css'
      - 'index.html'
      - 'functions/_middleware.js'
      - 'scripts/ovyx-project-sharing.test.mjs'
      - 'package.json'
      - '.github/workflows/ovyx-project-sharing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  project-sharing-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Verify project sharing security contracts
        run: node scripts/ovyx-project-sharing.test.mjs
      - name: Validate Pages application
        run: npm run validate
      - name: Build Pages Functions
        run: npm run build
