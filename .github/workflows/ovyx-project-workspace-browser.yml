name: OVYX Project Workspace Browser Tests

on:
  push:
    branches: [main]
    paths:
      - 'assets/ovyx-project-workspace-picker.js'
      - 'assets/ovyx-projects-unified-flow.js'
      - 'functions/api/workspaces.js'
      - 'functions/api/projects.js'
      - 'scripts/ovyx-workspaces-api.test.mjs'
      - 'functions/_middleware.js'
      - 'scripts/ovyx-project-workspace-picker.test.mjs'
      - 'scripts/ovyx-projects-unified-flow.test.mjs'
      - 'scripts/ovyx-project-workspace-picker.browser.test.mjs'
      - 'scripts/ovyx-owner-browser-api-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/ovyx-project-workspace-browser.yml'
  pull_request:
    branches: [main]
    paths:
      - 'assets/ovyx-project-workspace-picker.js'
      - 'functions/_middleware.js'
      - 'scripts/ovyx-project-workspace-picker.test.mjs'
      - 'scripts/ovyx-project-workspace-picker.browser.test.mjs'
      - 'scripts/ovyx-owner-browser-api-fixtures.mjs'
      - 'package.json'
      - '.github/workflows/ovyx-project-workspace-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project-workspace-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install project dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts --no-save playwright@^1.55.0
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run project workspace contract and static validation
        run: |
          node scripts/ovyx-project-workspace-picker.test.mjs
          node scripts/ovyx-projects-unified-flow.test.mjs
          node scripts/ovyx-workspaces-api.test.mjs
          npm run validate
      - name: Start local Cloudflare Pages app shell
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8795 > /tmp/ovyx-project-workspace-pages.log 2>&1 &
          echo $! > /tmp/ovyx-project-workspace-pages.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8795/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ovyx-project-workspace-pages.log
          exit 1
      - name: Test desktop and mobile project workspace picker in Chromium
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8795
        run: node scripts/ovyx-project-workspace-picker.browser.test.mjs
      - name: Print local Pages logs on failure
        if: failure()
        run: cat /tmp/ovyx-project-workspace-pages.log || true
