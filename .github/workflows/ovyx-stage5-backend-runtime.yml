name: OVYX Stage 5 Isolated Backend Runtime
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ovyx-generated-backend-runtime-eval.mjs'
      - 'backend-runtime/**'
      - '.dockerignore'
      - 'functions/api/webstudio/backend-runtime.js'
      - 'functions/api/_middleware.js'
      - 'assets/ovyx-webstudio-quality.js'
      - 'scripts/ovyx-backend-runtime-bridge.test.mjs'
      - 'docs/OVYX-BACKEND-RUNTIME-SETUP.md'
      - '.github/workflows/ovyx-backend-runtime-deploy.yml'
      - 'scripts/ovyx-generated-backend-runtime-eval.test.mjs'
      - 'functions/_lib/autonomous-qa.js'
      - 'functions/_lib/website-engine.js'
      - 'package.json'
      - '.github/workflows/ovyx-stage5-backend-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ovyx-generated-backend-runtime-eval.mjs'
      - 'backend-runtime/**'
      - 'functions/api/webstudio/backend-runtime.js'
      - 'functions/api/_middleware.js'
      - 'assets/ovyx-webstudio-quality.js'
      - 'scripts/ovyx-backend-runtime-bridge.test.mjs'
      - 'docs/OVYX-BACKEND-RUNTIME-SETUP.md'
      - '.github/workflows/ovyx-backend-runtime-deploy.yml'
      - 'scripts/ovyx-generated-backend-runtime-eval.test.mjs'
      - 'functions/_lib/autonomous-qa.js'
      - 'functions/_lib/website-engine.js'
      - 'package.json'
      - '.github/workflows/ovyx-stage5-backend-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-pages-d1-runtime:
    name: Disposable Pages Functions and D1 runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned repository dependencies
        run: npm install --ignore-scripts
      - name: Build the runtime image with system CA certificates before sandboxing
        run: |
          docker pull node:22-bookworm-slim
          docker build -t ovyx-pages-runtime-sandbox - <<'DOCKERFILE'
          FROM node:22-bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates && update-ca-certificates && rm -rf /var/lib/apt/lists/*
          DOCKERFILE
      - name: Verify per-project backend runtime bridge contracts
        run: node scripts/ovyx-backend-runtime-bridge.test.mjs
      - name: Build the production Cloudflare Sandbox container image
        run: docker build -f backend-runtime/Dockerfile -t ovyx-backend-runtime-worker .
      - name: Bundle and validate the Cloudflare Sandbox Worker
        working-directory: backend-runtime
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --config wrangler.jsonc
      - name: Execute generated backend fixture in a no-egress container
        env:
          OVYX_QA_NETWORK_ISOLATION: docker-none
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=2g,mode=1777 \
            --shm-size=256m \
            --memory=3g \
            --cpus=2 \
            --pids-limit=128 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --volume "$PWD:/workspace:ro" \
            --workdir /workspace \
            --env OVYX_QA_NETWORK_ISOLATION=docker-none \
            ovyx-pages-runtime-sandbox \
            node scripts/ovyx-generated-backend-runtime-eval.test.mjs
