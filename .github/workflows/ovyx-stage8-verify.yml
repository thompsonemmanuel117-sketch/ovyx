name: OVYX Stage 8 Website Management Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/stage-8-website-management]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Full regression suite
        run: npm test

      - name: Static verification
        run: npm run validate

      - name: Production build preflight
        run: npm run build

      - name: Wrangler CLI validation
        run: npx wrangler --version
