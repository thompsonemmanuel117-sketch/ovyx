name: OVYX Worldwide Compatibility
on:
  pull_request:
    paths:
      - 'functions/_lib/global-compatibility.js'
      - 'functions/_lib/global-readiness.js'
      - 'functions/api/global/compatibility.js'
      - 'scripts/ovyx-global-compatibility.test.mjs'
      - '.github/workflows/ovyx-global-compatibility.yml'
  push:
    branches: [main]
    paths:
      - 'functions/_lib/global-compatibility.js'
      - 'functions/_lib/global-readiness.js'
      - 'functions/api/global/compatibility.js'
      - 'scripts/ovyx-global-compatibility.test.mjs'
      - '.github/workflows/ovyx-global-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify worldwide compatibility boundaries
        run: node scripts/ovyx-global-compatibility.test.mjs
