on:
  push:
    branches:
      - main
    paths:
      - 'assets/ovyx-webstudio-quality.js'
      - 'assets/ovyx-webstudio-navigation-polish.js'
      - 'assets/ovyx-webstudio-code-search.js'
      - 'scripts/ovyx-webstudio-code-search.test.mjs'
      - 'scripts/ovyx-webstudio-code-search.browser.test.mjs'
      - 'scripts/ovyx-webstudio-appstudio-integration.browser.test.mjs'
      - 'scripts/ovyx-app-shell-favicon.browser.test.mjs'
      - 'index.html'
      - 'assets/ovyx-webstudio-project-branding.js'
      - 'assets/ovyx-brand-mark.svg'
      - 'assets/ovyx-shell-favicon-lock.js'
      - 'assets/ovyx-brand-mark.png'
      - '_headers'
      - 'manifest.json'
      - '_routes.json'
      - 'functions/_middleware.js'
      - 'scripts/ovyx-webstudio-quality.test.mjs'
      - 'scripts/ovyx-webstudio-quality.browser.test.mjs'
      - '.github/workflows/ovyx-webstudio-quality-browser.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'assets/ovyx-webstudio-quality.js'
      - 'assets/ovyx-webstudio-navigation-polish.js'
      - 'assets/ovyx-webstudio-code-search.js'
      - 'scripts/ovyx-webstudio-code-search.test.mjs'
      - 'scripts/ovyx-webstudio-code-search.browser.test.mjs'
      - 'scripts/ovyx-webstudio-appstudio-integration.browser.test.mjs'
      - 'scripts/ovyx-app-shell-favicon.browser.test.mjs'
      - 'index.html'
      - 'assets/ovyx-webstudio-project-branding.js'
      - 'assets/ovyx-brand-mark.svg'
      - 'assets/ovyx-shell-favicon-lock.js'
      - 'assets/ovyx-brand-mark.png'
      - '_headers'
      - 'manifest.json'
      - '_routes.json'
      - 'functions/_middleware.js'
      - 'scripts/ovyx-webstudio-quality.test.mjs'
      - 'scripts/ovyx-webstudio-quality.browser.test.mjs'
      - '.github/workflows/ovyx-webstudio-quality-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project dependencies
        run: npm install --ignore-scripts

      - name: Install browser test dependency
        run: npm install --ignore-scripts --no-save playwright@^1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Cloudflare Pages app shell
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8789 > /tmp/ovyx-pages-dev.log 2>&1 &
          echo $! > /tmp/ovyx-pages-dev.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8789/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ovyx-pages-dev.log
          exit 1
      - name: Test app-shell favicon in Chromium against local Pages runtime
        run: node scripts/ovyx-app-shell-favicon.browser.test.mjs

      - name: Test Web Studio static regression contract
        run: node scripts/ovyx-webstudio-quality.test.mjs
      - name: Test Web Studio quality inspector in Chromium
        run: node scripts/ovyx-webstudio-quality.browser.test.mjs
      - name: Test code workspace search and sidebar logo in Chromium
        run: node scripts/ovyx-webstudio-code-search.browser.test.mjs
      - name: Test Web Studio to App Studio to Code integration in Chromium
        run: node scripts/ovyx-webstudio-appstudio-integration.browser.test.mjs
# Regression coverage: sidebar inline-SVG full-draw state, brand-mark favicon fallback, and project/app favicon isolation.
