permissions:
  contents: read

jobs:
  assistant-workspace-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts --no-save playwright@^1.55.0

      - name: Verify source and run workspace persistence integration tests
        run: |
          npm run validate
          npm test
          node scripts/ovyx-app-studio-visual-refresh.test.mjs
          npm run build

      - name: Validate separate Sentinel Worker configuration without deploying
        run: npx wrangler deploy --config sentinel-worker/wrangler.toml --dry-run

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Cloudflare Pages app
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/ovyx-pages.log 2>&1 &
          echo $! > /tmp/ovyx-pages.pid
          curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:8788/ -o /dev/null

      - name: Run desktop and mobile browser regression suites with isolated browser load
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788
        run: |
          set +e
          run_shard() {
            label="$1"
            log_file="$2"
            shift 2
            for script in "$@"; do
              echo "[$label] START $script"
              timeout --signal=TERM --kill-after=30s 15m node "scripts/$script" 2>&1 | tee -a "$log_file"
              script_status=${PIPESTATUS[0]}
              if [ "$script_status" -ne 0 ]; then
                if [ "$script_status" -eq 124 ] || [ "$script_status" -eq 137 ]; then
                  echo "[$label] TIMEOUT after 15 minutes: $script"
                else
                  echo "[$label] FAILED ($script_status): $script"
                fi
                return "$script_status"
              fi
              echo "[$label] PASS $script"
            done
          }

          # Each browser suite covers desktop and mobile. Run the two groups
          # sequentially against the single local Pages worker: parallel Chromium
          # processes were starving navigation and causing unrelated goto timeouts.
          run_shard "app-studio-and-admin" /tmp/ovyx-assistant-shard-a.log \
            ovyx-account-notifications.browser.test.mjs \
            ovyx-brand-dna.browser.test.mjs \
            ovyx-url-analyzer.browser.test.mjs \
            ovyx-app-studio-premium-polish.browser.test.mjs \
            ovyx-app-studio-visual-refresh.browser.test.mjs \
            ovyx-app-studio-link-builder.browser.test.mjs \
            ovyx-app-studio-workspace.browser.test.mjs \
            ovyx-app-studio-release-health.test.mjs \
            ovyx-admin-workspace.browser.test.mjs \
            ovyx-admin-hub.browser.test.mjs
          shard_a_status=$?

          # Settings coverage runs once in the dedicated Settings Regression workflow.
          # Keep this group focused on Assistant, Sentinel, provider and Web Studio flows.
          run_shard "assistant-and-runtime" /tmp/ovyx-assistant-shard-b.log \
            ovyx-assistant-workspace.browser.test.mjs \
            ovyx-sentinel.browser.test.mjs \
            ovyx-provider-availability.browser.test.mjs \
            ovyx-webstudio-reliability.browser.test.mjs
          shard_b_status=$?

          if [ "$shard_a_status" -ne 0 ] || [ "$shard_b_status" -ne 0 ]; then
            echo "One or more Assistant Workspace browser-test groups failed."
            exit 1
          fi

      - name: Print local Pages logs on failure
        if: failure()
        run: cat /tmp/ovyx-pages.log || true
