name: OVYX Assistant Workspace Browser Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'assets/ovyx-assistant-workspace.js'
      - 'assets/ovyx-admin-workspace.js'
      - 'scripts/ovyx-admin-workspace.test.mjs'
      - 'scripts/ovyx-admin-workspace.browser.test.mjs'
      - '_headers'
      - 'scripts/ovyx-native-ai.test.mjs'
      - 'functions/api/ai/workspace-tools.js'
      - 'functions/_lib/ovyx-native-ai.js'
      - 'functions/_middleware.js'
      - 'scripts/ovyx-assistant-workspace.browser.test.mjs'
      - 'scripts/ovyx-workspace-tools.test.mjs'
      - 'scripts/ovyx-workspace-tools.integration.test.mjs'
      - 'scripts/ovyx-assistant-runtime.test.mjs'
      - 'scripts/ovyx-static-verify.mjs'
      - 'assets/ovyx-sentinel.js'
      - 'assets/ovyx-sentinel-avatar-3d.js'
      - 'scripts/ovyx-sentinel-avatar.test.mjs'
      - 'docs/OVYX-SENTINEL-AVATAR.md'
      - 'functions/api/admin/sentinel.js'
      - 'functions/_lib/ovyx-sentinel.js'
      - 'sentinel-worker/**'
      - 'scripts/ovyx-sentinel.test.mjs'
      - 'scripts/ovyx-sentinel.endpoint.test.mjs'
      - 'scripts/ovyx-sentinel.browser.test.mjs'
      - 'docs/OVYX-SENTINEL.md'
      - 'assets/ovyx-provider-availability.js'
      - 'assets/ovyx-additional-ai-provider-diagnostics.js'
      - 'scripts/ovyx-native-assistant-feedback.test.mjs'
      - 'scripts/ai-provider-status.test.mjs'
      - 'functions/api/ai/provider-availability.js'
      - 'scripts/provider-availability.test.mjs'
      - 'scripts/ovyx-provider-availability.browser.test.mjs'
      - 'assets/ovyx-webstudio-reliability.js'
      - 'functions/api/ai/feedback.js'
      - 'scripts/ovyx-webstudio-feedback.test.mjs'
      - 'scripts/ovyx-webstudio-reliability.test.mjs'
      - 'scripts/ovyx-webstudio-reliability.browser.test.mjs'
      - 'index.html'
      - 'scripts/ovyx-admin-hub.test.mjs'
      - 'scripts/ovyx-admin-hub.browser.test.mjs'
      - 'package.json'
      - '.github/workflows/ovyx-assistant-workspace-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistant-workspace-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts --no-save playwright@^1.55.0

      - name: Verify source and run workspace persistence integration tests
        run: |
          npm run validate
          npm test
          npm run build

      - name: Validate separate Sentinel Worker configuration without deploying
        run: npx wrangler deploy --config sentinel-worker/wrangler.toml --dry-run

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Cloudflare Pages app
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/ovyx-pages.log 2>&1 &
          echo $! > /tmp/ovyx-pages.pid
          curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:8788/ -o /dev/null

      - name: Exercise Admin Modules hub in desktop and mobile Chromium
        run: node scripts/ovyx-admin-hub.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise assistant workspace in desktop and mobile Chromium
        run: node scripts/ovyx-assistant-workspace.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise Sentinel guardian and wake-word flow in desktop and mobile Chromium
        run: node scripts/ovyx-sentinel.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise provider availability selector in desktop and mobile Chromium
        run: node scripts/ovyx-provider-availability.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise Web Studio feedback and build-preview safety in desktop and mobile Chromium
        run: node scripts/ovyx-webstudio-reliability.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise owner-only Admin Workspace in desktop and mobile Chromium
        run: node scripts/ovyx-admin-workspace.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Print local Pages logs on failure
        if: failure()
        run: cat /tmp/ovyx-pages.log || true
