permissions:
  contents: read

jobs:
  assistant-workspace-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          npm install --ignore-scripts
          npm install --ignore-scripts --no-save playwright@^1.55.0

      - name: Verify source and run workspace persistence integration tests
        run: |
          npm run validate
          npm test
          npm run build

      - name: Validate separate Sentinel Worker configuration without deploying
        run: npx wrangler deploy --config sentinel-worker/wrangler.toml --dry-run

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local Cloudflare Pages app
        run: |
          npx wrangler pages dev . --ip 127.0.0.1 --port 8788 > /tmp/ovyx-pages.log 2>&1 &
          echo $! > /tmp/ovyx-pages.pid
          curl --retry 30 --retry-connrefused --retry-delay 2 --fail http://127.0.0.1:8788/ -o /dev/null

      - name: Exercise App Studio per-app Brand DNA in desktop and mobile Chromium
        run: node scripts/ovyx-brand-dna.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise App Studio URL Analyzer in desktop and mobile Chromium
        run: node scripts/ovyx-url-analyzer.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise polished Project App Studio workspace in desktop and mobile Chromium
        run: node scripts/ovyx-app-studio-premium-polish.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise generated app functionality and live preview in desktop and mobile Chromium
        run: node scripts/ovyx-app-studio-link-builder.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise Stage 6 release health diagnostics
        run: node scripts/ovyx-app-studio-release-health.test.mjs

      - name: Exercise owner-only Admin Workspace in desktop and mobile Chromium
        run: node scripts/ovyx-admin-workspace.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788


      - name: Exercise Editor and Workspace settings in desktop and mobile Chromium
        run: node scripts/ovyx-settings-workspace.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise Security session revocation in desktop and mobile Chromium
        run: node scripts/ovyx-settings-security.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise Appearance single-owner actions in desktop and mobile Chromium
        run: node scripts/ovyx-settings-core.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise Settings Data Layer in desktop and mobile Chromium
        run: node scripts/ovyx-settings.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise AI Preferences Save Reset and request propagation
        run: node scripts/ovyx-settings-ai.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788
      - name: Exercise Settings Shortcuts in desktop and mobile Chromium
        run: node scripts/ovyx-settings-shortcuts.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788



      - name: Exercise Profile and Notifications in desktop and mobile Chromium
        run: node scripts/ovyx-settings-account.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise Admin Modules hub in desktop and mobile Chromium
        run: node scripts/ovyx-admin-hub.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise assistant workspace in desktop and mobile Chromium
        run: node scripts/ovyx-assistant-workspace.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise Sentinel guardian and wake-word flow in desktop and mobile Chromium
        run: node scripts/ovyx-sentinel.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise provider availability selector in desktop and mobile Chromium
        run: node scripts/ovyx-provider-availability.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Exercise Web Studio feedback and build-preview safety in desktop and mobile Chromium
        run: node scripts/ovyx-webstudio-reliability.browser.test.mjs
        env:
          OVYX_E2E_BASE_URL: http://127.0.0.1:8788

      - name: Print local Pages logs on failure
        if: failure()
        run: cat /tmp/ovyx-pages.log || true
